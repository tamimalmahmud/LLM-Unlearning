model_family: phi
num_shards: 4
EP: 1
resume_from: /data/urveim/talmahmud/ESU/checkpoints/P1_BM_EP1_shard_P50R50DP_EP1_epoch_10_lr_5e-05_phi
data_paths:
  - talmahmud/tofu_custom_split_ESU
  - talmahmud/tofu_custom_split_ESU
  - talmahmud/tofu_custom_split_ESU
  - talmahmud/tofu_custom_split_ESU
  - talmahmud/tofu_custom_split_ESU

splits:
  - shard_P50
  - shard4_1
  - shard4_2
  - shard4_3
  - shard4_4  
forget: full
batch_size: 4
gradient_accumulation_steps: 4
num_epochs: 5
lr: 5e-5
weight_decay: 0.01
seed: 42
save_dir: /data/urveim/talmahmud/ESU/checkpoints/P2_FM_EP${EP}_P50_Rshards_${num_shards}_epoch_${num_epochs}_lr_5e-05_${model_family}_mrr${continual.osl.mrr}_trr${continual.osl.trr}_cali${continual.osl.cali_batches}
continual:
  osl:
    mrr: 0.10             
    trr: 0.85             
    cali_batches: 4       
    target_linear_only: true
