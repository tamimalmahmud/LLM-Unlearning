model_family: phi
resume_from: None
data_paths:
  - talmahmud/tofu_custom_split_ESU
  - talmahmud/tofu_custom_split_ESU

splits:
  - shard2_1
  - shard2_2
num_shards: 2
batch_size: 4
gradient_accumulation_steps: 4
num_epochs: 10
lr: 5e-5
weight_decay: 0.01
seed: 42

save_dir: /data/urveim/talmahmud/ESU/checkpoints/SISA/SISA_ITr_R_${num_shards}slices_epoch_${num_epochs}_${model_family}_mrr${continual.osl.mrr}_trr${continual.osl.trr}_cali${continual.osl.cali_batches}

continual:
  osl:
    mrr: 0.10             
    trr: 0.85             
    cali_batches: 4       
    target_linear_only: true
